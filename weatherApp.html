<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="styles/weatherApp..css">
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" name="" id="input" placeholder="Enter city name.." spellcheck="false" 
            >
            <button><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <div class="error">
         <p>Invalid city name...</p>
        </div>
        <div class="weather">
            <img src="images/weather/rain.png" alt="" class="weather-icon">
            <h1 class="temp">21<small><sup>o</sup></small>c</h1>
            <h2 class="city">Indore</h2>
            <div class="details">
                 <div class="col">
                    <img src="images/weather/humidity.png" alt="">
                    <div>
                        <p class="humidity">50%</p>
                        <p>Humidity</p>
                    </div>
                 </div>
                 
                 <div class="col">
                    <img src="images/weather/wind.png" alt="">
                    <div>
                        <p class="wind">13 km/h</p>
                        <p>Wind Speed</p>
                    </div>
                 </div>
            </div>

        </div>
    </div>

    <script>

        const apiKey="4706612428d97dc7914cde5938562fdf"
        // const apiUrl="https://api.openweathermap.org/data/2.5/weather?q=indore&appid=4706612428d97dc7914cde5938562fdf&units=metric"
        const apiUrl="https://api.openweathermap.org/data/2.5/weather?appid=4706612428d97dc7914cde5938562fdf&units=metric&q="
        const searchBox=document.querySelector(".search input")
        const searchBtn=document.querySelector(".search button")
        const weatherIcon=document.querySelector(".weather-icon")


        async function checkWeather(city){
            const response=await fetch(apiUrl+ city + `&appid=${apiKey}`);
            if(response.status==404){
                document.querySelector(".error").style.display="block";
               document.querySelector(".weather").style.display="none";

            }
            else{
            var data=await response.json();
            console.log(data)

            document.querySelector(".city").innerHTML=data.name;
            document.querySelector(".temp").innerHTML=Math.round(data.main.temp)+'<small><sup>o</sup></small>c</h1>';
            document.querySelector(".humidity").innerHTML=data.main.humidity  + "%";
            document.querySelector(".wind").innerHTML=data.wind.speed + " km/h ";

            if(data.weather[0].main=="Clouds"){
                weatherIcon.src="images/weather/Clouds.png"
            }
            else if(data.weather[0].main=="Clear"){
                weatherIcon.src="images/weather/Clear.png"

            }
            else if(data.weather[0].main=="Rain"){
                weatherIcon.src="images/weather/Rain.png"

            }
            else if(data.weather[0].main=="Drizzle"){
                weatherIcon.src="images/weather/drizzle.png"

            }
            else if(data.weather[0].main=="Mist"){
                weatherIcon.src="images/weather/mist.png"

            }

            document.querySelector(".weather").style.display="block";
            document.querySelector(".error").style.display="none";

            

        }
    }
        searchBtn.addEventListener("click", ()=>{
        checkWeather(searchBox.value);
             
        })
    </script>
</body>
</html>
