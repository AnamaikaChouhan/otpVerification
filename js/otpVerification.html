          <button id="generateBtn">Generate OTP</button>

      let generatedOTP = "";

      let generateBtn = document.querySelector("#generateBtn");

      let verifyBtn = document.querySelector("#verifyBtn");

      let inputs = document.querySelectorAll(".input-div input");

      let messageBox = document.querySelector("#messageBox");

      // Auto focus next input

      inputs.forEach((input, index) => {
        input.addEventListener("input", () => {
          if (input.value.length == 1) {
            if (index < inputs.length - 1) {
              inputs[index + 1].focus();
            }
          }
          input.addEventListener("keydown", (e) => {
            if (e.key === "Backspace" && input.value === "") {
              if (index > 0) {
                inputs[index - 1].focus();
              }
            }
          });
        });

        // Paste OTP
input.addEventListener("contextmenu", async (e) => {

  e.preventDefault();

  let pastedData = await navigator.clipboard.readText();

  pastedData = pastedData.replace(/[^0-9]/g, "");

  pastedData.split("").forEach((num, i) => {

    let currentIndex = index + i;

    if (inputs[currentIndex]) {
      inputs[currentIndex].value = num;
    }

  });


          // Focus last filled input
          let lastIndex = pastedData.length - 1;

          if (inputs[lastIndex]) {
            inputs[lastIndex].focus();
          }
        });
        });
      

      // Generate OTP

      generateBtn.addEventListener("click", () => {
        generatedOTP = Math.floor(1000 + Math.random() * 9000);
        //  navigator.clipboard.writeText(generatedOTP);
        console.log("Generated OTP:", generatedOTP);

        messageBox.style.display = "block";

        messageBox.style.color = "blue";
        messageBox.style.border = "1px solid blue";
        messageBox.innerHTML = `
  OTP generated successfully <br>
  <small>Your OTP is: <b  id="otpText">${generatedOTP}</b></small>
`;
        document.getElementById("otpText").addEventListener("click", () => {
          navigator.clipboard.writeText(generatedOTP);
          window
            .getSelection()
            .selectAllChildren(document.getElementById("otpText"));
        });
      });

      // Verify OTP

      verifyBtn.addEventListener("click", () => {
        let enteredOTP = "";

        inputs.forEach((input) => {
          enteredOTP += input.value;
        });

        console.log("Entered OTP:", enteredOTP);

        // Empty OTP check

        if (enteredOTP.length < 4) {
          messageBox.style.display = "block";

          messageBox.style.color = "orange";
          messageBox.style.border = "1px solid orange";
          messageBox.innerText = "Please Generate OTP";

          return;
        }

        // OTP Match check

        if (enteredOTP == generatedOTP) {
          messageBox.style.display = "block";
          messageBox.style.border = "1px solid green";
          messageBox.style.color = "green";

          messageBox.innerText = "OTP Verified";
        } else {
          messageBox.style.display = "block";

          messageBox.style.color = "red";
          messageBox.style.border = "1px solid red";

          messageBox.innerText = "Invalid OTP...Retry";
        }

        // Clear inputs

        inputs.forEach((input) => {
          input.value = "";
        });

        // Focus first input

        inputs[0].focus();
      });
